<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Culture Recall Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
html{color-scheme:light}body{margin:0}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one study column; header with a diffusion-rings mark and session tally; six recall modes as tabs */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --sunk:#F5F6FA; --ink:#171B2B; --muted:#596079; --line:#D5D9E5;
  --accent:#3346A6; --accent-soft:#E2E6F7; --accent-ink:#FFFFFF; --warm:#B07A0C; --warm-soft:#F6EBD2;
  --good:#22713A; --good-soft:#E1F1E5; --bad:#B42318; --bad-soft:#FBE4E1;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10121B; --surface:#181B28; --sunk:#131620; --ink:#E5E7F0; --muted:#9AA0B8; --line:#2A2F43;
  --accent:#93A3F2; --accent-soft:#1E2544; --accent-ink:#0C1026; --warm:#E3B54B; --warm-soft:#3A2F14;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10121B; --surface:#181B28; --sunk:#131620; --ink:#E5E7F0; --muted:#9AA0B8; --line:#2A2F43;
  --accent:#93A3F2; --accent-soft:#1E2544; --accent-ink:#0C1026; --warm:#E3B54B; --warm-soft:#3A2F14;
  --good:#63C27A; --good-soft:#163222; --bad:#F2776C; --bad-soft:#3D1C1A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand svg{flex:none;width:50px;height:50px}
.eyebrow{margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--display);font-weight:800;letter-spacing:-.025em;font-size:clamp(28px,6vw,38px);line-height:1.05}
.tally{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.tally b{display:block;font-size:26px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 15px var(--body);padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:16px 48px;display:grid;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,4vw,28px);display:grid;gap:14px;min-width:0}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.prompt{margin:0;font-size:clamp(19px,3.4vw,23px);line-height:1.4;font-weight:600;text-wrap:pretty}
.prompt.term{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(28px,5.5vw,36px)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:150px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--good);background:var(--good-soft)} input.no{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--body);padding:9px 16px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.good{border-color:var(--good);color:var(--good)} .btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;color:var(--muted);padding-inline:8px}
button:focus-visible,.chip:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.kbd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:0}
.big{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:54px;line-height:1;margin:0}
.missed{display:flex;flex-wrap:wrap;gap:6px}
.missed span{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:3px 9px;font-size:14px;font-weight:600}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.mc{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);font:600 15px var(--body);padding:11px 13px;border-radius:10px;cursor:pointer;min-width:0}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:5px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)} .fb.info{background:var(--accent-soft)}
.fb strong{font-size:15px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)} .fb.info strong{color:var(--accent)}
.fb p{margin:0}
.answer{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.check label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--sunk)}
ul.check input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px;flex:none}
ul.check label.on{border-color:var(--good);background:var(--good-soft)}
.auto{font-family:var(--mono);font-size:11px;color:var(--good);margin-left:auto;white-space:nowrap;padding-left:8px}
details.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sheet summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details.sheet summary::-webkit-details-marker{display:none}
details.sheet summary::after{content:"Show";font-family:var(--mono);font-size:12px;color:var(--accent)}
details.sheet[open] summary::after{content:"Hide"}
.sheet-body{border-top:1px solid var(--line);padding:4px clamp(14px,3vw,22px) 12px}
.sheet-body h4{margin:16px 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.def{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 14px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
@media (max-width:480px){.def{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;min-width:600px}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl td:first-child{font-weight:700}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(3px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap head">
    <div class="brand">
      <svg viewBox="0 0 50 50" aria-hidden="true">
        <circle cx="25" cy="25" r="22" fill="none" stroke="var(--line)" stroke-width="2"/>
        <circle cx="25" cy="25" r="15" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3" opacity=".7"/>
        <circle cx="25" cy="25" r="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="25" cy="25" r="3.2" fill="var(--warm)"/>
        <circle cx="42" cy="12" r="3" fill="var(--warm)" opacity=".85"/><circle cx="9" cy="38" r="2.4" fill="var(--warm)" opacity=".7"/>
      </svg>
      <div>
        <p class="eyebrow">AP Human Geography · Unit 3</p>
        <h1>Culture Recall Lab</h1>
      </div>
    </div>
    <div class="tally"><b id="tally">0 / 0</b>correct this session</div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Study modes">
    <button role="tab" id="tab-mc" data-tab="mc" aria-selected="true">Multiple choice</button>
    <button role="tab" id="tab-vocab" data-tab="vocab" aria-selected="false">Vocab</button>
    <button role="tab" id="tab-cls" data-tab="cls" aria-selected="false">Classify it</button>
    <button role="tab" id="tab-rl" data-tab="rl" aria-selected="false">Religions &amp; languages</button>
    <button role="tab" id="tab-exp" data-tab="exp" aria-selected="false">Explain it</button>
  </nav>
</div>

<main class="wrap">
  <details class="sheet"><summary>Study sheet</summary><div class="sheet-body" id="sheet-body"></div></details>
  <section id="pane-mc" role="tabpanel" aria-labelledby="tab-mc"><div class="bar"><div class="chips" id="mc-filter"></div><span class="count" id="mc-count"></span></div><div id="mc-card"></div></section>
  <section id="pane-vocab" role="tabpanel" aria-labelledby="tab-vocab" hidden><div class="bar"><div class="chips" id="vocab-filter"></div><div class="chips" id="vocab-dir"></div></div><div id="vocab-card"></div></section>
  <section id="pane-cls" role="tabpanel" aria-labelledby="tab-cls" hidden><div class="bar"><div class="chips" id="cls-filter"></div><span class="count" id="cls-count"></span></div><div id="cls-card"></div></section>
  <section id="pane-rl" role="tabpanel" aria-labelledby="tab-rl" hidden><div class="bar"><div class="chips" id="rl-filter"></div><span class="count" id="rl-count"></span></div><div id="rl-card"></div></section>
  <section id="pane-exp" role="tabpanel" aria-labelledby="tab-exp" hidden><div class="bar"><div class="chips" id="exp-chips"></div></div><div id="exp-card"></div></section>
</main>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem('u3:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('u3:'+k,JSON.stringify(v));}catch(e){}}};
const norm=s=>String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/^(the|a|an) /,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function matches(input,aliases){const n=norm(input);if(!n)return false;return aliases.some(a=>{const b=norm(a);if(n===b)return true;const tol=b.length>=10?2:(b.length>=5?1:0);return lev(n,b)<=tol;});}
let tally={right:0,total:0};
function score(ok){tally.total++;if(ok)tally.right++;$('#tally').textContent=tally.right+' / '+tally.total;}
const missMap=()=>store.get('miss',{});
function bump(k,d){const m=missMap();m[k]=Math.max(0,(m[k]||0)+d);store.set('miss',m);}
function filterChips(id,opts,key,onChange){let cur=store.get(key,Object.keys(opts)[0]);if(!opts[cur])cur=Object.keys(opts)[0];
  const draw=()=>{$('#'+id).innerHTML=Object.entries(opts).map(([k,l])=>`<button class="chip" data-k="${k}" aria-pressed="${cur===k}">${l}</button>`).join('');
    document.querySelectorAll('#'+id+' .chip').forEach(c=>c.onclick=()=>{cur=c.dataset.k;store.set(key,cur);draw();onChange();});};
  draw();return()=>cur;}

/* ---------- vocabulary ---------- */
// term | definition | aliases | group (cul = culture & landscape, dif = diffusion, eff = effects & language contact, rel = religion & language)
const TERMS=[
 ['Culture','The shared beliefs, practices, values, and material things of a group, passed down from generation to generation.',[],'cul'],
 ['Cultural traits','Single elements of a culture, like food, clothing, music, language, or religion.',['cultural trait','trait'],'cul'],
 ['Cultural relativism','Understanding and judging a culture by its own standards instead of your own.',['relativism'],'cul'],
 ['Ethnocentrism','Judging other cultures by the standards of your own and seeing your own culture as superior.',['ethnocentric'],'cul'],
 ['Folk culture','The traditional culture of small, rural, close-knit groups. It changes slowly and spreads mostly by relocation diffusion.',['folk'],'cul'],
 ['Popular culture','The culture of large, diverse societies. It changes quickly and spreads fast, often by hierarchical diffusion through media.',['pop culture','popular'],'cul'],
 ['Cultural landscape','The visible imprint of human activity and culture on the land, like buildings, farms, signs, and monuments.',['built environment'],'cul'],
 ['Sequent occupance','The idea that each group that lives in a place leaves its own cultural imprint, building up layers over time.',[],'cul'],
 ['Sacred space','A place a religion considers holy, like Mecca, Jerusalem, or the Ganges River.',['sacred site','sacred place'],'cul'],
 ['Sense of place','The feelings and meanings people attach to a place based on their experiences there.',[],'cul'],
 ['Placemaking','Shaping public spaces so they reflect a community’s identity and bring people together.',['place making'],'cul'],
 ['Placelessness','When places lose their uniqueness and start to look the same everywhere, like the same chain stores in every town.',[],'cul'],
 ['Traditional architecture','Buildings that use local materials and styles, reflecting the folk culture of a place.',['vernacular architecture','traditional'],'cul'],
 ['Postmodern architecture','A modern style that mixes older design elements with new materials. It’s common in global cities and makes skylines look similar.',['postmodern'],'cul'],
 ['Ethnicity','Identity with a group that shares ancestry and cultural traits like language and religion.',['ethnic group'],'cul'],
 ['Ethnic enclave','A neighborhood with a high concentration of one ethnic group, like a Chinatown or Little Italy.',['ethnic neighborhood','enclave'],'cul'],
 ['Cultural diffusion','The spread of cultural traits from one place to another.',['diffusion'],'dif'],
 ['Hearth','The place where a cultural trait or idea first started.',['cultural hearth'],'dif'],
 ['Relocation diffusion','Spread through the physical movement of people who bring a trait with them to a new place.',['relocation'],'dif'],
 ['Expansion diffusion','Spread outward from a hearth while the trait stays strong where it started.',['expansion'],'dif'],
 ['Hierarchical diffusion','Spread from powerful or important people and places (big cities, celebrities) down to others.',['hierarchical'],'dif'],
 ['Reverse hierarchical diffusion','Spread that starts with ordinary people or small places and moves up to bigger or more powerful ones.',['reverse hierarchical'],'dif'],
 ['Contagious diffusion','Fast spread from person to person to everyone nearby, like a disease or a viral video.',['contagious'],'dif'],
 ['Stimulus diffusion','The basic idea spreads, but people change it to fit their own culture.',['stimulus'],'dif'],
 ['Colonialism','When a country takes control of another territory and settles it, spreading its language, religion, and customs.',['colonization'],'dif'],
 ['Imperialism','When a country extends its power and control over other areas, politically or economically, without necessarily settling there.',['imperial'],'dif'],
 ['Diaspora','The scattering of a group of people away from their homeland, like the Jewish or African diaspora.',['diasporas'],'dif'],
 ['Globalization','The growing connection of the world’s economies, cultures, and people.',[],'dif'],
 ['Time-space compression','The shrinking time it takes for people, goods, and ideas to travel, so the world feels smaller.',['time space compression','space time compression'],'dif'],
 ['Cultural convergence','When cultures become more alike through contact with each other.',['convergence'],'eff'],
 ['Cultural divergence','When cultures become more different or separate from each other.',['divergence'],'eff'],
 ['Acculturation','When a group adopts some traits of another culture but keeps its own culture too.',[],'eff'],
 ['Assimilation','When a group fully adopts the dominant culture and loses its original cultural traits.',['assimilate'],'eff'],
 ['Syncretism','When two cultures blend to create a new cultural trait, like Day of the Dead.',['cultural syncretism','syncretic'],'eff'],
 ['Multiculturalism','When many cultures exist side by side in one society and keep their own identities.',['multicultural'],'eff'],
 ['Lingua franca','A shared language used for trade and communication between people with different native languages, like English today.',[],'eff'],
 ['Pidgin','A simplified mix of two or more languages used for trade, with no native speakers.',['pidgin language'],'eff'],
 ['Creole','A pidgin that becomes the native language of a group, like Haitian Creole.',['creole language'],'eff'],
 ['Creolization','The blending of different cultures or languages into a new one.',[],'eff'],
 ['Language family','A group of languages that share a common ancestor from before recorded history, like Indo-European.',['family'],'rel'],
 ['Language branch','Languages within a family that share a more recent common origin, like Germanic or Romance.',['branch'],'rel'],
 ['Language group','Languages within a branch that share a recent origin and similar grammar and vocabulary, like West Germanic.',['group'],'rel'],
 ['Dialect','A regional variety of a language with its own accent, words, or grammar.',['dialects'],'rel'],
 ['Isolated language','A language that isn’t related to any other language, like Basque.',['language isolate','isolate'],'rel'],
 ['Toponym','The name given to a place.',['toponyms','place name'],'rel'],
 ['Universalizing religion','A religion that tries to appeal to everyone and actively seeks converts, like Christianity, Islam, Buddhism, and Sikhism.',['universalizing'],'rel'],
 ['Ethnic religion','A religion tied to one group of people or place that doesn’t actively seek converts, like Hinduism and Judaism.',['ethnic'],'rel'],
 ['Secularism','The idea that religion should not play a role in government or public life, or a decline in religious belief.',['secular'],'rel'],
].map(([t,d,a,g])=>({t,d,a:[t,...a],g}));
const byT=Object.fromEntries(TERMS.map(x=>[x.t,x]));

/* ---------- religions & languages ---------- */
const RELIGIONS=[
 {n:'Christianity',type:'Universalizing',hearth:'The Levant (Jerusalem / Bethlehem)',hA:['levant','jerusalem','bethlehem','israel','palestine','middle east','southwest asia'],
  spread:'Missionaries (relocation) and Roman Emperor Constantine (hierarchical)',branches:'Roman Catholic, Protestant, Eastern Orthodox',bA:['catholic','protestant','orthodox'],holy:'Jerusalem, Rome (Vatican City)',size:'Largest religion (about 2.4 billion)'},
 {n:'Islam',type:'Universalizing',hearth:'Arabian Peninsula (Mecca)',hA:['mecca','arabian peninsula','arabia','saudi arabia','makkah'],
  spread:'Trade routes and military conquest, then missionaries',branches:'Sunni (most), Shia',bA:['sunni','shia','shiite','shi a'],holy:'Mecca, Medina, Jerusalem (Dome of the Rock)',size:'Second largest, fastest growing'},
 {n:'Buddhism',type:'Universalizing',hearth:'Northeast India / Nepal (Bodh Gaya)',hA:['india','nepal','bodh gaya','northern india','northeast india','lumbini','south asia'],
  spread:'Missionaries and the Silk Road, helped by Emperor Ashoka (hierarchical)',branches:'Theravada, Mahayana, Vajrayana',bA:['theravada','mahayana','vajrayana'],holy:'Bodh Gaya (where the Buddha found enlightenment)',size:'Mostly East and Southeast Asia'},
 {n:'Sikhism',type:'Universalizing',hearth:'Punjab region (India / Pakistan)',hA:['punjab','india','pakistan','south asia'],
  spread:'Mostly relocation through migration (diaspora)',branches:'Founded by Guru Nanak',bA:['guru nanak'],holy:'Golden Temple in Amritsar',size:'About 25–30 million, mostly in Punjab'},
 {n:'Hinduism',type:'Ethnic',hearth:'Indus River Valley (South Asia)',hA:['indus','indus river valley','india','south asia','indus valley'],
  spread:'Mostly stayed in South Asia; spread by relocation with Indian migrants',branches:'Many gods; caste system historically tied to it',bA:['vishnu','shiva','brahman','many gods','polytheistic'],holy:'Ganges River, Varanasi',size:'Third largest, mostly in India and Nepal'},
 {n:'Judaism',type:'Ethnic',hearth:'The Levant (Jerusalem)',hA:['levant','jerusalem','israel','middle east','southwest asia','palestine'],
  spread:'Relocation through the Jewish diaspora',branches:'Orthodox, Conservative, Reform',bA:['orthodox','conservative','reform'],holy:'Jerusalem (Western Wall)',size:'One of the first monotheistic religions'},
 {n:'Shinto',type:'Ethnic',hearth:'Japan',hA:['japan'],spread:'Stayed in Japan',branches:'Worship of kami (nature spirits)',bA:['kami'],holy:'Shrines across Japan',size:'Almost all in Japan'},
];
const LANGS=[
 ['English','Indo-European','Germanic'],['German','Indo-European','Germanic'],['Dutch','Indo-European','Germanic'],['Swedish','Indo-European','Germanic'],
 ['Spanish','Indo-European','Romance'],['French','Indo-European','Romance'],['Italian','Indo-European','Romance'],['Portuguese','Indo-European','Romance'],['Romanian','Indo-European','Romance'],
 ['Russian','Indo-European','Balto-Slavic'],['Polish','Indo-European','Balto-Slavic'],['Ukrainian','Indo-European','Balto-Slavic'],
 ['Hindi','Indo-European','Indo-Iranian'],['Bengali','Indo-European','Indo-Iranian'],['Persian (Farsi)','Indo-European','Indo-Iranian'],['Urdu','Indo-European','Indo-Iranian'],

/* ---------- generic multiple-choice engine ---------- */
function makeEngine(id,gen,opts={}){
  const E={queue:[],cur:null,state:'ask',right:0,total:0,picked:null};
  const next=re=>{if(re&&E.cur)E.queue.splice(Math.min(3,E.queue.length),0,{...E.cur,retry:true});if(!E.queue.length)E.queue=gen();E.cur=E.queue.shift();E.state='ask';E.picked=null;render();};
  function finish(ok){E.total++;if(ok)E.right++;score(ok);if(E.cur.key)bump(E.cur.key,ok?-1:1);E.state=ok?'right':'wrong';E.miss=!ok;render();}
  function render(){const q=E.cur,el=$('#'+id+'-card'),st=E.state;$('#'+id+'-count').textContent=`${E.right} / ${E.total} correct`;
    const fb=st==='ask'?'':`<div class="fb ${st==='right'?'ok':'no'}"><strong>${st==='right'?'Correct.':'Not quite. This one comes back in a few questions.'}</strong>${st!=='right'?`<p class="answer">${esc(q.answer)}</p>`:''}${q.why?`<p>${q.why}</p>`:''}</div>`;
    el.innerHTML=`<div class="card"><p class="label">${esc(q.label)}${q.retry?' · try again':''}</p><div class="prompt">${q.prompt}</div>
      <div class="mc">${q.choices.map((c,i)=>{let cls='';if(st!=='ask')cls=c===q.answer?'ok':c===E.picked?'no':'dim';return `<button class="opt ${cls}" data-i="${i}" ${st!=='ask'?'disabled':''}><span class="k">${i+1}</span><span>${esc(c)}</span></button>`;}).join('')}</div>
      ${fb}<div class="row">${st==='ask'?`<span class="kbd">Press 1–${q.choices.length}</span>`:`<button class="btn primary" id="${id}-next">Next</button><span class="kbd">Enter</span>`}</div></div>`;
    if(st==='ask')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{E.picked=q.choices[+b.dataset.i];finish(E.picked===q.answer);});
    else{const b=$('#'+id+'-next');b.onclick=()=>next(E.miss);b.focus();}}
  return{start(){E.right=0;E.total=0;E.queue=gen();next();},key(e){const q=E.cur;if(q&&E.state==='ask'&&/^[1-9]$/.test(e.key)){const b=document.querySelector(`#${id}-card .opt[data-i="${+e.key-1}"]`);if(b)b.click();}}};
}

function mcDef(pool){const x=pick(pool);const wrong=shuffle(TERMS.filter(y=>y!==x&&y.g===x.g)).slice(0,3).map(y=>y.t);return{label:'Definition',prompt:esc(x.d),choices:shuffle([x.t,...wrong]),answer:x.t,key:x.t};}
function mcCls(keys){const k=pick(keys),c=CLS[k],[s,a,w]=pick(c.items);const choices=c.opts.length<=4?[...c.opts]:shuffle([a,...shuffle(c.opts.filter(o=>o!==a)).slice(0,3)]);
  return{label:c.name,prompt:esc(k==='rel'?`Is ${s} a universalizing or an ethnic religion?`:s),choices,answer:a,why:esc(w)};}
function mcRel(){const r=pick(RELIGIONS);const kind=pick(['hearth','holy','branches']);
  const others=shuffle(RELIGIONS.filter(x=>x!==r));
  if(kind==='hearth'){const ch=[r.hearth,...[...new Set(others.map(x=>x.hearth))].filter(h=>h!==r.hearth).slice(0,3)];return{label:'Religion',prompt:`Where is the hearth of ${esc(r.n)}?`,choices:shuffle(ch),answer:r.hearth,why:esc(`${r.n} spread through: ${r.spread}.`)};}
  if(kind==='holy')return{label:'Religion',prompt:`Which religion’s holy places include ${esc(r.holy)}?`,choices:shuffle([r.n,...others.slice(0,3).map(x=>x.n)]),answer:r.n};
  return{label:'Religion',prompt:`Which religion has these branches or features: ${esc(r.branches)}?`,choices:shuffle([r.n,...others.slice(0,3).map(x=>x.n)]),answer:r.n};}
function mcLang(){const [l,f,b]=pick(LANGS);if(b&&Math.random()<.5){return{label:'Language',prompt:`${esc(l)} belongs to which branch of the Indo-European family?`,choices:shuffle(['Germanic','Romance','Balto-Slavic','Indo-Iranian']),answer:b};}
  const fams=Object.keys(FAM_A);return{label:'Language',prompt:`${esc(l)} belongs to which language family?`,choices:shuffle([f,...shuffle(fams.filter(x=>x!==f)).slice(0,3)]),answer:f};}

    el.innerHTML=`<div class="card">${head}<p class="prompt term">${esc(x.t)}</p>${body}</div>`;
    if($('#v-ta')){const ta=$('#v-ta');ta.focus();ta.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();V.state='grade';renderVocab();}};$('#v-show').onclick=()=>{V.state='grade';renderVocab();};}
    if($('#v-got')){$('#v-got').onclick=()=>{vRight();V.state='done';renderVocab();};$('#v-missed').onclick=()=>{vMiss();V.state='done';renderVocab();};}
    if($('#v-next')&&st==='done'){$('#v-next').onclick=nextVocab;$('#v-next').focus();}}}

/* ---------- RELIGIONS & LANGUAGES (typed) ---------- */
const RLF={mix:'Mixed',rel:'Religions',lang:'Languages'};
const rlF=filterChips('rl-filter',RLF,'rlF',()=>RL.start());
function rlGen(){const f=rlF(),out=[];
  const relQ=()=>{const r=pick(RELIGIONS),k=pick(['type','hearth','branch','holy']);
    if(k==='type')return{q:`Is ${r.n} universalizing or ethnic?`,a:[r.type],show:r.type,why:r.type==='Universalizing'?'It seeks converts worldwide.':'It’s tied to one group or place.'};
    if(k==='hearth')return{q:`Where is the hearth of ${r.n}?`,a:r.hA,show:r.hearth,why:`Spread: ${r.spread}.`};
    if(k==='branch')return{q:`Name a branch or key feature of ${r.n}.`,a:r.bA,show:r.branches,why:''};
    return{q:`Name a holy place of ${r.n}.`,a:r.holy.toLowerCase().replace(/[()]/g,',').split(/,| and /).map(s=>s.trim()).filter(Boolean),show:r.holy,why:''};};
  const langQ=()=>{const [l,f2,b]=pick(LANGS);if(b&&Math.random()<.5)return{q:`${l} is in which branch of Indo-European?`,a:BR_A[b],show:b,why:`${l}: ${f2} family, ${b} branch.`};
    return{q:`${l} belongs to which language family?`,a:FAM_A[f2],show:f2,why:''};};
  for(let i=0;i<10;i++){const x=f==='rel'?relQ():f==='lang'?langQ():(Math.random()<.5?relQ():langQ());out.push(x);}return out;}
const R={queue:[],cur:null,state:'ask',right:0,total:0,typed:''};
const RL={start(){R.right=0;R.total=0;R.queue=rlGen();nextRL();}};
function nextRL(re){if(re&&R.cur)R.queue.splice(Math.min(3,R.queue.length),0,R.cur);if(!R.queue.length)R.queue=rlGen();R.cur=R.queue.shift();R.state='ask';R.typed='';renderRL();}
function renderRL(){const q=R.cur,el=$('#rl-card'),st=R.state;$('#rl-count').textContent=`${R.right} / ${R.total} correct`;
  const fb=st==='ask'?'':`<div class="fb ${st==='right'?'ok':'no'}"><strong>${st==='right'?'Correct.':st==='reveal'?'Here’s the answer.':'Not quite.'}</strong><p class="answer">${esc(q.show)}</p>${q.why?`<p>${esc(q.why)}</p>`:''}</div>`;
  el.innerHTML=`<div class="card"><p class="label">${rlF()==='lang'||/language|branch of Indo/.test(q.q)?'Languages':'Religions'}</p><p class="prompt">${esc(q.q)}</p><label for="rl-in" style="position:absolute;left:-9999px">Your answer</label><input type="text" id="rl-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" ${st!=='ask'?'readonly':''} value="${esc(R.typed)}" class="${st==='right'?'ok':st==='ask'?'':'no'}">${fb}
    <div class="row">${st==='ask'?'<button class="btn primary" id="rl-check">Check</button><button class="btn ghost" id="rl-idk">I don’t know</button>':`<button class="btn primary" id="rl-next">Next</button>${st==='wrong'?'<button class="btn ghost" id="rl-ov">I had it right</button>':''}`}<span class="kbd">Enter</span></div></div>`;
  const inp=$('#rl-in');
  const fin=ok=>{R.total++;if(ok)R.right++;score(ok);R.miss=!ok;};
  const check=()=>{if(!inp.value.trim()){inp.focus();return;}R.typed=inp.value;const v=norm(inp.value);const ok=matches(inp.value,q.a)||q.a.some(a=>{const b=norm(a);return b.length>=4&&(v.includes(b)||b.includes(v)&&v.length>=4);});fin(ok);R.state=ok?'right':'wrong';renderRL();};
  if(st==='ask'){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check();}};$('#rl-check').onclick=check;$('#rl-idk').onclick=()=>{fin(false);R.state='reveal';renderRL();};}
  else{inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();nextRL(R.miss);}};const b=$('#rl-next');b.onclick=()=>nextRL(R.miss);b.focus();
    if($('#rl-ov'))$('#rl-ov').onclick=()=>{R.right++;tally.right++;$('#tally').textContent=tally.right+' / '+tally.total;R.miss=false;R.state='right';renderRL();};}}

/* ---------- EXPLAIN IT ---------- */

let expCur=store.get('exp',EXP[0].id);if(!EXP.find(e=>e.id===expCur))expCur=EXP[0].id;
const X={state:'write',text:'',checks:[],auto:[]};
function renderExpChips(){const best=store.get('expBest',{});$('#exp-chips').innerHTML=EXP.map(e=>`<button class="chip" data-id="${e.id}" aria-pressed="${e.id===expCur}">${esc(e.t)}${best[e.id]!=null?` <span class="count">${best[e.id]}/${e.pts.length}</span>`:''}</button>`).join('');
  document.querySelectorAll('#exp-chips .chip').forEach(c=>c.onclick=()=>{expCur=c.dataset.id;store.set('exp',expCur);X.state='write';X.text='';renderExpChips();renderExp();});}
function renderExp(){const e=EXP.find(x=>x.id===expCur),el=$('#exp-card');
  if(X.state==='write'){el.innerHTML=`<div class="card"><p class="label">Explain it · from memory</p><p class="prompt">${esc(e.q)}</p><label for="x-ta" style="position:absolute;left:-9999px">Your answer</label><textarea id="x-ta" style="min-height:180px" placeholder="Write it like an FRQ answer. Use the vocab and give specific examples."></textarea><div class="row"><button class="btn primary" id="x-check">Check my answer</button><span class="kbd">Ctrl + Enter</span></div></div>`;
    const ta=$('#x-ta');ta.value=X.text;ta.focus();ta.oninput=()=>X.text=ta.value;ta.onkeydown=ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();$('#x-check').click();}};
    $('#x-check').onclick=()=>{if(!X.text.trim()){ta.focus();return;}const low=' '+X.text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ')+' ';X.checks=e.pts.map(p=>p[1].some(k=>low.includes(k)));X.auto=[...X.checks];X.state='check';renderExp();};
  }else{const n=e.pts.length,got=X.checks.filter(Boolean).length;
    el.innerHTML=`<div class="card"><p class="label">${esc(e.t)}</p><div class="row" style="gap:12px;align-items:baseline"><p class="big" id="x-score">${got}/${n}</p><p class="tip" style="flex:1;min-width:200px">Check off each point you covered. "Found" tags are a guess from keywords, so fix them if they’re wrong.</p></div>
      <ul class="check">${e.pts.map((p,i)=>`<li><label class="${X.checks[i]?'on':''}"><input type="checkbox" data-i="${i}" ${X.checks[i]?'checked':''}><span>${esc(p[0])}</span>${X.auto[i]?'<span class="auto">found</span>':''}</label></li>`).join('')}</ul>
      <div class="fb info"><strong>What you wrote</strong><p style="white-space:pre-wrap">${esc(X.text)}</p></div>
      <div class="row"><button class="btn primary" id="x-save">Save score &amp; next</button><button class="btn" id="x-again">Try this one again</button></div></div>`;
    el.querySelectorAll('ul.check input').forEach(cb=>cb.onchange=()=>{X.checks[+cb.dataset.i]=cb.checked;cb.parentElement.classList.toggle('on',cb.checked);$('#x-score').textContent=X.checks.filter(Boolean).length+'/'+n;});
    $('#x-again').onclick=()=>{X.state='write';X.text='';renderExp();};
    $('#x-save').onclick=()=>{const g=X.checks.filter(Boolean).length,best=store.get('expBest',{});best[e.id]=Math.max(best[e.id]||0,g);store.set('expBest',best);X.checks.forEach(score);
      const i=EXP.indexOf(e);expCur=EXP[(i+1)%EXP.length].id;store.set('exp',expCur);X.state='write';X.text='';renderExpChips();renderExp();};}}

/* ---------- tabs + boot ---------- */
const TABS=['mc','vocab','cls','rl','exp'];
function showTab(t){TABS.forEach(x=>{$('#pane-'+x).hidden=x!==t;$('#tab-'+x).setAttribute('aria-selected',x===t);});store.set('tab',t);
  const f=document.querySelector('#pane-'+t+' input[type=text]:not([readonly]),#pane-'+t+' textarea');if(f)f.focus();}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(!$('#pane-mc').hidden)MC.key(e);if(!$('#pane-cls').hidden)CL.key(e);});
MC.start();CL.start();buildVocab();RL.start();renderExpChips();renderExp();
const t0=store.get('tab','mc');showTab(TABS.includes(t0)?t0:'mc');
